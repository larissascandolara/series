<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
        <h1 class="cadastro">
            Cadastro De Séries
        </h1>

    <div class="caixa">
     
    
        <form method="post">
            
            <h1 class="titulo"> Título:</h1>
            <br>
            <input type="text" placeholder="Digite o título" id="titulo" required>
            <br>

            <h1 class="epsodios"> Quantidade de epsódios:</h1>
            <br>
            <input type="text" placeholder="Digite a quantidade de epsódios" id="episodios" required>
            <br>

            <h1 class="descricao">Descrição: </h1>
            <br>
            <input type="text" placeholder="Digite a descrição" id="descricao" required>
            <br>

            <h1 class="autor"> Autor: </h1>
            <br>
            <input type="text" placeholder="Digite o nome do autor" id="autor" required>
            <br>


            <br> <br> <br> <br>

            <button type="button"  onClick="cadastrar()">Cadastrar</button>

        </form>

    </div> 



      
    

<script src="js/script.js"></script>
</body>
</html>
